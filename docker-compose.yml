# =============================================================================
# 本地开发/验证用的 docker-compose
# =============================================================================
# 用途：在本地起基础中间件（Postgres + RabbitMQ），
#       方便开发时运行微服务做端到端验证。
# 注意：这只是【本地开发】用的。生产部署到 K3S 时，Postgres 跑在宿主机 Docker、
#       RabbitMQ 用 Helm 部署进集群，应用全部容器化。此处不包含应用镜像。
# =============================================================================
services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-invest-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: smartinvest
      POSTGRES_USER: smartadmin
      POSTGRES_PASSWORD: localdev_only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartadmin -d smartinvest"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: smart-invest-mq
    ports:
      - "5672:5672"      # AMQP 协议端口（应用连这个）
      - "15672:15672"    # 管理控制台
    environment:
      RABBITMQ_DEFAULT_USER: smartmq
      RABBITMQ_DEFAULT_PASS: localdev_only
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
