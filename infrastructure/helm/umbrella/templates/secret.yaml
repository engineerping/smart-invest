# ==============================================================================
# 🔐 Secret —— K8S Secret 模板（敏感信息：数据库密码、JWT 密钥、RabbitMQ 密码）
# ==============================================================================
#
# 工作流中的位置：
#   Helm 渲染这个模板 → 用 Values 填充 → Base64 编码 → 创建 K8S Secret 资源
#   → Deployment 通过 secretKeyRef 引用 → Pod 启动时 K8S 注入环境变量
#
# 安全注意事项（重要！）：
#   K8S Secret 默认只是 Base64 编码，不是加密！
#   Base64("password") = "cGFzc3dvcmQ=" → 任何人都能 decode
#
#   生产环境安全加固建议（按优先级）：
#   1. 启用 etcd 静态加密（encryption at rest）
#   2. 用 RBAC 严格限制谁能读 Secret
#   3. 用 SealedSecret: 加密后可以安全存入 Git（推荐！）
#   4. 用 ExternalSecret: 从 Vault / AWS Secrets Manager 自动同步密钥
#   5. 用 Helm 的 --set 从 CI/CD 环境变量注入，不在 yaml 文件里写明文
# ==============================================================================

apiVersion: v1
kind: Secret

metadata:
  # ─── Secret 名称 ───
  # 所有微服务的 Deployment 模板都引用这个名字的 Secret。
  # 不要改这个名字，除非同步修改所有 Deployment 的 secretKeyRef.name。
  name: smart-invest-secrets

  # ─── 标签 ───
  # 标准 K8S 推荐标签，方便 kubectl 筛选和管理
  labels:
    app.kubernetes.io/name: smart-invest
    app.kubernetes.io/part-of: smart-invest
    app.kubernetes.io/managed-by: Helm

type: Opaque  # Opaque = 通用 Secret 类型（最常见的类型）
              # 其他类型：kubernetes.io/tls（TLS 证书）、kubernetes.io/dockerconfigjson（镜像仓库认证）

# ─── Secret 数据 ───
# 注意：stringData 和 data 的区别
#   stringData：写明文，Helm 自动 Base64 编码（当前使用的方式，方便配置）
#   data：需要手动 Base64 编码（如 echo -n "password" | base64）
#
# b64enc 是 Helm 模板函数，把字符串转成 Base64。
data:
  # ─── 数据库密码 ───
  # Spring Boot 会将环境变量 SPRING_DATASOURCE_PASSWORD 自动映射为
  # spring.datasource.password 配置项（Relaxed Binding 机制）
  SPRING_DATASOURCE_PASSWORD: {{ .Values.secrets.dbPassword | b64enc }}

  # ─── JWT 签名密钥 ───
  # 所有微服务共享同一个密钥来签发和验证 JWT Token。
  # 生产环境要求：
  #   - 至少 256 位（32 字节）的随机字符串
  #   - 不同环境用不同密钥
  #   - 定期轮换（配合 JWT 过期时间）
  JWT_SECRET: {{ .Values.secrets.jwtSecret | b64enc }}

  # ─── RabbitMQ 密码 ───
  # Spring AMQP 自动读取 spring.rabbitmq.password
  RABBITMQ_PASSWORD: {{ .Values.secrets.rabbitmqPassword | b64enc }}

  # ─── RabbitMQ Erlang Cookie ───
  # RabbitMQ 集群节点之间通信用的共享密钥。
  # 这里虽然是单节点，但 RabbitMQ 启动时需要这个环境变量。
  RABBITMQ_ERLANG_COOKIE: {{ .Values.secrets.rabbitmqPassword | b64enc }}
