# =============================================================================
# 💾 PersistentVolumeClaim (PVC) —— RabbitMQ 的「磁盘申请」
# =============================================================================
#
# 📖 为什么 RabbitMQ 需要 PVC 而 user-service 不需要?
#   RabbitMQ 是「有状态服务」——消息和队列定义必须落盘, Pod 重启后数据必须还在。
#   user-service 是「无状态服务」——没有需要持久化的本地数据,
#   所有数据都存在 PostgreSQL (外部数据库) 里, 所以不需要 PVC。
#
# 📖 PVC/PV/StorageClass 关系 (面试高频):
#   PV (PersistentVolume)       = 实际的磁盘资源    (管理员创建 / 动态供应)
#   PVC (PersistentVolumeClaim)  = 用户对磁盘的申请  (Pod 想要 N GB 磁盘)
#   StorageClass                 = 磁盘的「模板」    (定义用什么存储、怎么创建)
#
#   类比 Java:
#   PV  = DataSource 连接池 (实际资源)
#   PVC = DataSource.getConnection() (申请资源)
#   StorageClass = HikariCP 配置 (自动创建连接池)
#
# 📖 动态供应 (Dynamic Provisioning):
#   K3S 默认自带 local-path-provisioner (一个 StorageClass),
#   当 PVC 创建时, 它自动在节点上创建目录并绑定 PV。
#   所以在 K3S 里你只需创建 PVC, 不需要手动创建 PV。
#
# 📖 accessModes 说明:
#   ReadWriteOnce (RWO) = 只能被一个节点上的一个 Pod 读写 (RabbitMQ 单实例适用)
#   ReadOnlyMany  (ROX) = 多节点只读 (如共享配置文件)
#   ReadWriteMany  (RWX) = 多节点读写 (如 NFS, 分布式文件系统)
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-data             # ← PVC 名, Deployment 里 claimName 引用此名
spec:
  accessModes:
    - ReadWriteOnce               # 单节点读写 (符合 K3S 单机环境)
  resources:
    requests:
      storage: {{ .Values.persistence.size }}  # 渲染结果: storage: 1Gi

