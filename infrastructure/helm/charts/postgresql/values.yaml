# ==============================================================================
# 📋 values.yaml —— PostgreSQL 子 Chart 的默认配置
# ==============================================================================
#
# 有状态服务特有的配置项：
#   - persistence.size：持久卷大小（数据落盘）
#   - auth：数据库用户名/密码/库名
#   - resources：Postgres 对内存/CPU 需求比应用服务更高
#
# 安全注意事项：
#   auth.password 是敏感信息，部署时通过 umbrella chart 的 secrets 覆盖，
#   或通过 --set auth.password=$DB_PASSWORD 从 CI/CD 环境变量注入。
# ==============================================================================

# ─── 副本数 ───
# 数据库通常跑 1 副本（单节点架构）。
# 多副本需要配置主从复制（primary + replica），那是生产高可用话题。
# 对于学习/演示环境，1 副本足够了。
replicaCount: 1

# ─── 镜像 ───
image:
  repository: postgres
  tag: "16-alpine"                # Alpine 轻量版（镜像只有 ~250MB，standard 版 ~450MB）
  pullPolicy: IfNotPresent

# ─── 服务端口 ───
service:
  type: ClusterIP                  # 只在集群内访问（不对外暴露）
  port: 5432                       # PostgreSQL 标准端口

# ═════════════════════════════════════════════════════════════════════════════
# 数据库认证配置
# ═════════════════════════════════════════════════════════════════════════════
# 这些值会被注入为环境变量，Postgres 官方镜像在首次启动时自动创建数据库和用户。
#
# Postgres 官方镜像的约定（环境变量自动初始化）：
#   POSTGRES_DB       → 自动创建这个数据库
#   POSTGRES_USER     → 自动创建这个用户（并设为超级用户）
#   POSTGRES_PASSWORD → 设置用户密码
#
# 如果 PVC 里已有数据（不是首次启动），这些环境变量会被忽略，
# Postgres 直接使用已有数据目录启动。
# ═════════════════════════════════════════════════════════════════════════════
auth:
  database: smartinvest            # 数据库名（和 docker-compose 保持一致）
  username: smartadmin             # 用户名
  # password 是敏感信息，这里不写默认值，强制从 umbrella chart 传入
  # password: ""                   # ← 部署时必须通过 --set 或 umbrella values 传入

# ═════════════════════════════════════════════════════════════════════════════
# 容器资源限制
# ═════════════════════════════════════════════════════════════════════════════
# PostgreSQL 对内存比较敏感，它会使用系统内存作为缓存（shared_buffers）。
# 默认的 shared_buffers 配置偏低，生产环境需要调优。
# 这个配置对学习/演示环境足够。
# ═════════════════════════════════════════════════════════════════════════════
resources:
  requests:
    cpu: 200m                       # Postgres 空闲时很省 CPU，查询时峰值较高
    memory: 256Mi
  limits:
    cpu: "1"                        # 允许 burst 到 1 核
    memory: 512Mi                   # 允许用到 512MB（含 shared_buffers + 连接内存）

# ═════════════════════════════════════════════════════════════════════════════
# 持久化存储 —— 有状态服务的核心！
# ═════════════════════════════════════════════════════════════════════════════
# PVC 的作用：
#   Pod 启动 → K3S 检查 PVC → 自动创建 PV（local-path）→ 挂载到 Pod
#   → Postgres 在 /var/lib/postgresql/data 读写数据 → 数据写入节点本地磁盘
#   → Pod 重启 → PVC 不变 → 数据完好
#
# ⚠️ 警告：K3S local-path 数据存在 EC2 本地磁盘上！
#   如果 EC2 被终止（Terminate）→ 数据永久丢失。
#   你需要手动备份数据库（pg_dump）到 S3 或定期打 EBS 快照。
# ==============================================================================
persistence:
  enabled: true
  size: 5Gi                        # 5GB（对学习环境足够了，不够可以扩容）
  # storageClass: local-path       # K3S 默认，不需要显式指定
  # 扩容方式：kubectl edit pvc data-postgresql-0 → 改 spec.resources.requests.storage
  # 注意：扩容后还需要在 EC2 上 resize 文件系统（如果是 XFS/ext4）

# ═════════════════════════════════════════════════════════════════════════════
# 健康检查 —— Postgres 特有的探针配置
# ═════════════════════════════════════════════════════════════════════════════
# 用 pg_isready 命令检查数据库是否准备好接受连接。
# 这是 Postgres 官方推荐的健康检查方式（比 TCP 端口检查更准确）。
# ═════════════════════════════════════════════════════════════════════════════
readinessProbe:
  enabled: true
  initialDelaySeconds: 10           # Postgres 启动较快，10 秒就差不多了
  periodSeconds: 10

livenessProbe:
  enabled: true
  initialDelaySeconds: 30           # 存活探测比就绪探测更宽松（避免没启动完就被杀）
  periodSeconds: 20
