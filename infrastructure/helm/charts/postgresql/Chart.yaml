# ==============================================================================
# 📦 Chart.yaml —— PostgreSQL 子 Chart 的身份证明
# ==============================================================================
#
# PostgreSQL 是所有微服务共享的关系数据库。
# 和 RabbitMQ 一样，它是"有状态"服务 —— 数据必须持久化，Pod 重启不能丢数据。
#
# 有状态 vs 无状态的区别：
#   - 无状态（user-service）：Pod 挂了重启，新 Pod 完全一样 —— 用 Deployment
#   - 有状态（PostgreSQL）：Pod 挂了重启，必须挂同一个磁盘 —— 用 StatefulSet
#
# 为什么用 StatefulSet 而不是 Deployment：
#   1. 稳定网络标识：每个 Pod 有固定 DNS 名（postgresql-0.postgresql.ns.svc.cluster.local）
#   2. 有序部署/扩缩容：先启动 postgresql-0，再启动 postgresql-1
#   3. 持久存储一对一绑定：postgresql-0 始终绑定 pvc-data-postgresql-0
#   4. 滚动更新顺序：从最大的 index 开始（postgresql-2 → 1 → 0）
# ==============================================================================

apiVersion: v2

name: postgresql
description: Smart Invest PostgreSQL 数据库（StatefulSet + PVC 持久化）

type: application

version: 1.0.0
appVersion: "16"              # PostgreSQL 16（当前 LTS 版本）
