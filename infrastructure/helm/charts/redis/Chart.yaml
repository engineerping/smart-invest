# ==============================================================================
# 📦 Chart.yaml —— Redis 子 Chart 的身份证明
# ==============================================================================
#
# Redis 是内存缓存 + 可选持久化。
# 虽然 Redis 主要用内存，但也可以把数据 RDB/AOF 持久化到磁盘。
# 如果不持久化，Pod 重启后缓存丢失（对缓存场景来说通常是可接受的）。
#
# 缓存 vs 数据库的持久化区别：
#   - 数据库（PostgreSQL）：数据必须持久化，丢失 = 灾难
#   - 缓存（Redis）：数据可以不持久化，丢失 = 重新从数据库加载（慢一点但不会丢）
# ==============================================================================

apiVersion: v2

name: redis
description: Smart Invest Redis 缓存（Deployment + PVC，可选持久化）

type: application

version: 1.0.0
appVersion: "7.4"              # Redis 7.4（稳定版）
