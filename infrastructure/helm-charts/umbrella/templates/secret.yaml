# =============================================================================
# Secret —— 敏感配置（密码、JWT 密钥）
# =============================================================================
# K8S 的 Secret 用 base64 编码存储（不是加密，生产应配合外部密钥管理）。
# 这里用 Helm 变量占位，部署时通过 --set 或 values 传入真实值，
# 或者用 SealedSecret / ExternalSecret 从 Vault 拉取（生产最佳实践）。
#
# 面试可讲：这个 Secret 对应架构图里 AWS Secrets Manager 的位置。
#
# 使用 dig 安全取值：.Values.secrets 不存在时也不会报错，走默认值。
# 默认值已是 base64 编码：
#   echo -n 'localdev_only' | base64  = bG9jYWxkZXYtb25seQ==
#   echo -n 'smartinvest-demo-...-32bytes' | base64 = c21hcnRpbnZlc3Qt...
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: smart-invest-secrets
type: Opaque
data:
  SPRING_DATASOURCE_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  RABBITMQ_PASSWORD: {{ .Values.secrets.rabbitmqPassword | quote }}
