# =============================================================================
# 🔐 Secret —— Kubernetes 敏感配置资源 (密码、JWT 密钥、Token)
# =============================================================================
#
# 📖 这个模板在 Helm 工作流中的位置:
#   helm install → 读取 values.yaml → 渲染此模板 → 得到以下 YAML → apply 到集群
#
# 📖 K8S Secret 三个要点:
#   1. data 字段要求值是 base64 编码 (不是加密！只是编码)
#   2. Helm 的 b64enc 函数自动帮我们把明文转 base64
#   3. Pod 通过两种方式使用 Secret:
#      a) 环境变量注入 (如 deployment.yaml 里的 secretKeyRef) ← 本项目用这种
#      b) Volume 挂载 (以文件形式出现在容器内)
#
# 📖 安全说明 (面试加分点):
#   Kubernetes Secret 默认只是 base64 编码, 不是加密！
#   任何有权限 kubectl get secret 的人都能解码出明文。
#   生产环境应配合:
#     - SealedSecret: 加密后可以安全存入 Git
#     - ExternalSecret: 从 Vault / AWS Secrets Manager 自动同步到 K8S
#     - HashiCorp Vault Sidecar: 运行时注入, 不存进 K8S
#
# 📖 Helm 模板语法关键点 (此文件中用到):
#   {{ .Values.secrets.dbPassword | b64enc | quote }}
#       ↑                     ↑         ↑        ↑
#       │                     │         │        └─ quote: 给结果加引号 (防止 YAML 解析出错)
#       │                     │         └─ b64enc: Helm 的 base64 编码函数
#       │                     └─ 点号路径: 从 values.yaml 中读 secrets.dbPassword
#       └─ 模板变量定界符
#
#   管道符 | 是 Go Template 的风格: 左边的输出 → 右边的输入
#   类比 Java Stream: .Values.secrets.dbPassword.map(b64enc).map(quote)
#
# 📖 K8S Secret 类型:
#   Opaque (默认)          → 通用 key-value 密钥
#   kubernetes.io/tls      → TLS 证书专用 (字段必须是 tls.crt 和 tls.key)
#   kubernetes.io/dockerconfigjson → Docker 仓库认证 (imagePullSecrets 用)
# =============================================================================
apiVersion: v1
kind: Secret                    # ← K8S 资源类型: Secret
metadata:
  name: smart-invest-secrets    # ← Secret 的名字 (deployment 里 secretKeyRef 引用此名)
  # 如果部署时用 helm install my-rel ... 而非 smart-invest
  # 可以写 {{ .Release.Name }}-secrets 来动态生成名
type: Opaque                    # ← Opaque = 通用密钥类型, 值不透明
data:
  # ─── SPRING_DATASOURCE_PASSWORD ───
  # 渲染过程:
  #   1. Helm 读 values.yaml → secrets.dbPassword = "localdev_only"
  #   2. b64enc 函数 → "bG9jYWxkZXYtb25seQ=="
  #   3. quote 函数 → '"bG9jYWxkZXYtb25seQ=="' (加了双引号)
  #   4. 最终 YAML: SPRING_DATASOURCE_PASSWORD: "bG9jYWxkZXYtb25seQ=="
  SPRING_DATASOURCE_PASSWORD: {{ .Values.secrets.dbPassword | b64enc | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | b64enc | quote }}
  RABBITMQ_PASSWORD: {{ .Values.secrets.rabbitmqPassword | b64enc | quote }}

