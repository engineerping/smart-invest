# =============================================================================
# 🚪 Ingress —— Kubernetes 的「HTTP 反向代理」配置
# =============================================================================
#
# 📖 这是 umbrella 父 Chart 的模板 (不同于各微服务自己的 deployment.yaml/service.yaml),
#    它只负责「外部流量怎么路由到内部服务」。
#    因为 Ingress 是集群级别的入口, 放在 umbrella 层最合理。
#
# 📖 K3S 环境说明:
#   本项目跑在华硕 K3S 上, K3S 默认自带 Traefik 作为 Ingress Controller。
#   Ingress Controller 是「执行者」, Ingress 资源是「规则配置」。
#   类比: Ingress 是「nginx.conf 的 server/location 配置」,
#         Nginx 进程是「真正转发流量的程序」。
#         这里的 Ingress 资源配置 = 写 location 规则,
#         Traefik (Ingress Controller)   = Nginx 进程。
#
# 📖 路径路由逻辑:
#   外部请求到达 → K3S 节点的 80/443 端口 → Traefik 收到
#     → Traefik 查 Ingress 规则:
#        path: /     → 路由到 frontend Service (React 静态页面)
#        path: /api  → 路由到 api-gateway Service (API Gateway, 再转发到各微服务)
#
# 📖 内网穿透说明:
#   华硕服务器跑在内网 (192.168.31.192), 通过 frp/ngork 等内网穿透工具
#   把 80/443 映射到公网域名后, 外网用户就能通过公网域名访问到这里的 Ingress。
#
# 📖 注意: 这个 Ingress 不是 Helm 模板 (没有 {{ .Values.xxx }}), 是纯静态 YAML。
#    因为路由规则相对固定, 不需要参数化。如果生产环境需要不同规则
#    (如多域名/HTTPS), 就可以参数化它。
# =============================================================================
apiVersion: networking.k8s.io/v1     # ← Ingress 的 API 版本
kind: Ingress                        # ← K8S 资源类型
metadata:
  name: smart-invest
  annotations:
    # ─── kubernetes.io/ingress.class ───
    # 指定哪个 Ingress Controller 来处理这个 Ingress。
    # K3S 默认是 traefik, 云上可能是 nginx/alb/istio。
    # 这个 annotation 在 K8S v1.18+ 已被 IngressClass 资源替代 (向后兼容保留)
    kubernetes.io/ingress.class: traefik
    # ─── 演示环境不强制 HTTPS ───
    # 内网穿透时可能无证书, 生产应:
    #   1. 安装 cert-manager (Helm Chart)
    #   2. 加 annotation: cert-manager.io/cluster-issuer: letsencrypt-prod
    #   3. spec.tls 配置域名和证书
spec:
  rules:
    # ─── 如果没有写 host 字段 → 所有 HTTP Host 头都匹配 (开发环境) ───
    # 生产环境应该指定域名:
    #   - host: api.smart-invest.example.com
    #     http: ...
    - http:
        paths:
          # ─── 前端静态资源 ───
          # path: /     → 匹配根路径
          # pathType: Prefix → 前缀匹配 (如 /, /index.html, /static/xxx 都匹配)
          # 注意: / 和 /api 两个规则的顺序很重要！
          #   / 是 Prefix, 按 K8S 规则「最长前缀优先」,
          #   所以 /api/xxx 优先匹配 /api 规则, / 匹配所有其他
          - path: /
            pathType: Prefix            # Prefix = 前缀匹配实施匹配
            backend:
              service:
                name: frontend          # ← 目标 Service 名
                port:
                  number: 80            # ← Service 的端口

          # ─── API 统一入口 ───
          # 所有 /api/** 请求 → api-gateway → Spring Cloud Gateway 路由 → 各微服务
          # 微服务间内部通信用 Service DNS (如 user-service:8081), 不走 Ingress
          - path: /api
            pathType: Prefix            # Prefix = 前缀匹配
            backend:
              service:
                name: api-gateway       # ← 目标 Service 名
                port:
                  number: 8080          # ← api-gateway 的端口
