# =============================================================================
# umbrella 全局 values —— 统一覆盖子 chart 的默认值
# =============================================================================
# 部署时可用 -f 覆盖此文件，或 --set 覆盖单个值。
# 这里的键对应子 chart 的名字（Helm 约定：chart 名 + 配置）。
# =============================================================================

# 全局镜像 tag：所有服务用同一个版本（部署时由 CI/CD 注入实际版本）
global:
  imageTag: v1

# 敏感配置（部署时用真实值覆盖；这里是演示默认明文，Secret 模板会自动 base64）
secrets:
  dbPassword: "localdev_only"
  jwtSecret: "smartinvest-demo-secret-key-change-me-please-32bytes"
  rabbitmqPassword: "localdev_only"

# 各子 chart 的配置（会与子 chart 自己的 values.yaml 合并，此处优先）
# fullnameOverride 保证 Service 名固定为 user-service 等，
# 便于其他服务/nginx 用稳定 DNS 名访问（如 http://order-service:8083）。
user-service:
  replicaCount: 1
  fullnameOverride: user-service
  image:
    tag: v1

fund-service:
  replicaCount: 1
  fullnameOverride: fund-service
  image:
    tag: v1

order-service:
  replicaCount: 1
  fullnameOverride: order-service
  image:
    tag: v1

notification-worker:
  replicaCount: 1
  fullnameOverride: notification-worker
  image:
    tag: v1

api-gateway:
  replicaCount: 1
  fullnameOverride: api-gateway
  image:
    tag: v1

frontend:
  replicaCount: 1
  fullnameOverride: frontend
  image:
    tag: v1

# === 演示：远程依赖 Redis 的条件开关 ===
# 配合 Chart.yaml 中注释掉的 redis 依赖使用
# condition: redis.enabled 指向这里
# redis:
#   enabled: false
