# =============================================================================
# 📋 values.yaml —— Helm Chart 的「默认配置」, 类比 Spring Boot 的 application.yml
# =============================================================================
#
# 📖 这个文件在 Helm 工作流中的位置（对照 Helm_Complete_Guide.md §6.1 步骤 3）:
#   helm install smart-invest ./umbrella/ --namespace smart-invest
#     │
#     ├── ① 加载 chart 内置 values.yaml (就是这个文件) ← 第 1 层
#     ├── ② 加载所有子 chart 各自的 values.yaml          ← 第 2 层
#     ├── ③ 用 -f 指定的外部文件覆盖                      ← 第 3 层
#     └── ④ 用 --set 命令行参数覆盖（最高优先级）           ← 第 4 层
#
# 📖 四层 Values 合并（低优先级先, 高优先级后覆盖）:
#   Layer 1: chart 内置 values.yaml          (默认值,最低)
#   Layer 2: 父 chart 的 values (覆盖子 chart)  ← 就是这个文件
#   Layer 3: -f 指定的外部 values.yaml 文件
#   Layer 4: --set 参数 (最高优先级)
#
# 📖 类比 Java:
#   values.yaml = application.yml 的默认值
#   -f values-prod.yaml = spring.profiles.active=prod
#   --set image.tag=v2 = 命令行 --spring.datasource.url=xxx
#
# 📖 说明:
#   这个文件是 umbrella (父 Chart) 的 values.yaml,
#   里面的键会覆盖同名子 Chart 自己的 values.yaml (因为父 > 子)。
#   例如: umbrella 里写了 user-service.replicaCount: 1,
#         user-service 自己的 values.yaml 也写了 replicaCount: 1,
#         最终生效的是 umbrella 的值 (父 Chart 优先级更高)。
# =============================================================================

# ═════════════════════════════════════════════════════════════════════════════
# global —— 跨所有子 Chart 共享的配置
# ═════════════════════════════════════════════════════════════════════════════
# Helm 约定: 写 global 下的值会自动注入到每个子 Chart 的 .Values.global 中,
# 不需要在每个子 Chart 下重复写。子 Chart 模板里可以引用 {{ .Values.global.xxx }}
# 类比 Java: Spring Boot 的共享配置 (application.yml 里的 spring.application.name)
global:
  # 所有微服务用同一个镜像 tag (部署时 CI/CD 会传入实际版本)
  imageTag: v1

# ═════════════════════════════════════════════════════════════════════════════
# secrets —— 敏感配置, 会渲染到 K8S Secret 资源中
# ═════════════════════════════════════════════════════════════════════════════
# 📖 安全说明:
#   这里写的是演示明文。生产环境不要把这些值写进 values.yaml!
#   生产最佳实践:
#     1. 用 SealedSecret (加密后可以安全存入 Git)
#     2. 用 ExternalSecret (从 Vault/AWS Secrets Manager 同步到 K8S)
#     3. 用 helm install -f secrets.yaml (secrets.yaml 不在 Git 里)
#   这些值最终会被 secret.yaml 模板用 b64enc 转成 base64 存入 K8S Secret
secrets:
  dbPassword: "localdev_only"
  jwtSecret: "smartinvest-demo-secret-key-change-me-please-32bytes"
  rabbitmqPassword: "localdev_only"

# ═════════════════════════════════════════════════════════════════════════════
# 子 Chart 配置 —— 每个子 Chart 一段, key = 子 Chart 名
# ═════════════════════════════════════════════════════════════════════════════
# 📖 合并规则（面试会问！）:
#   umbrella (父) 的 values → 覆盖 → user-service (子) 的同名 values
#   最终 user-service 模板渲染时看到的是合并后的值。
#   所以 parent chart 是「总控」，可以统一调参数而不用一个个改子 Chart。
#
# 📖 fullnameOverride 的作用:
#   控制模板里 {{ include "svc.fullname" . }} 的输出结果。
#   写成固定的 "user-service" 而不是 release 名称拼的前缀,
#   是因为其他服务要通过固定 DNS 名访问它:
#     例: order-service 内部访问 http://user-service:8081/api/users
#   这里的 "user-service" 就是 K8S Service 的名字, 也是 DNS 名。
# =============================================================================

# ─── user-service 子 Chart 配置 ───
user-service:
  replicaCount: 1                          # 副本数 (只演示环境)
  fullnameOverride: user-service           # 固定资源名, 方便服务间调用
  image:
    tag: v1                                # 镜像版本

fund-service:
  replicaCount: 1
  fullnameOverride: fund-service
  image:
    tag: v1

order-service:
  replicaCount: 1
  fullnameOverride: order-service
  image:
    tag: v1

notification-worker:
  replicaCount: 1
  fullnameOverride: notification-worker
  image:
    tag: v1

api-gateway:
  replicaCount: 1
  fullnameOverride: api-gateway
  image:
    tag: v1

frontend:
  replicaCount: 1
  fullnameOverride: frontend
  image:
    tag: v1

# ═════════════════════════════════════════════════════════════════════════════
# 📖 演示: 可选依赖的条件开关
# ═════════════════════════════════════════════════════════════════════════════
# 配合 Chart.yaml 中注释掉的 redis 依赖:
#   condition: redis.enabled  → Helm 读到这个字段, 来 values.yaml 里找 redis.enabled
#   如果是 false → 跳过安装这个依赖; true → 安装
# 这样可以用同一套 Chart 配置来控制是否安装可选组件
#
redis:
  enabled: false    # ← 设为 true 就会安装 Redis, false 就跳过

# ═════════════════════════════════════════════════════════════════════════════
# 📖 Hook 相关配置（配合 templates/rabbitmq-ready-hook.yaml 使用）
# ═════════════════════════════════════════════════════════════════════════════
# 部署时建议使用:
#   helm install smart-invest ./umbrella/ --atomic --timeout 600s
#
# --atomic → 失败自动 rollback（比 --wait 更安全）
# --timeout 600s → 10分钟足够拉镜像 + 启动 + Hook 检查完成
#
# 如果内网环境拉镜像很慢（如华硕 K3S 拉 Docker Hub 受限），
# 可先手动 import 镜像后再 helm install（参考 k3s-image-import-workflow 文档）

