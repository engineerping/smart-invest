# =============================================================================
# ServiceMonitor —— 让 Prometheus 采集微服务指标
# =============================================================================
# kube-prometheus-stack 用 Prometheus Operator 管理 Prometheus。
# ServiceMonitor 是 CRD：告诉 Prometheus "哪些 Service 需要采集，从哪个端口抓"。
# 这里让 Prometheus 抓取 4 个 Java 服务的 /actuator/prometheus 端点。
# =============================================================================
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: smart-invest-services
  namespace: monitoring
  labels:
    release: monitoring   # 匹配 kube-prometheus-stack 的 serviceMonitorSelector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: smart-invest  # 匹配 umbrella release 的 Pod 标签
  namespaceSelector:
    matchNames:
      - smart-invest
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
      targetPort: 8080
      # 每个服务端口不同，这里用相对路径采集；实际以各服务的 Service port 为准
  # 注意：本文件作为示例，具体端口需按各服务 Service 调整
