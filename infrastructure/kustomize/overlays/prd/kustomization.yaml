# =============================================================================
# kustomize/overlays/prd —— prd 环境覆盖
# =============================================================================
# 演示多环境差异化能力。prd 环境用更高规格（可注释按需调整）。
# 实际部署仍以 Helm 为主，此 overlay 展示 Kustomize 如何在 Helm 之上做环境覆盖。
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patchesStrategicMerge:
  - patch-deployments.yaml
