# =============================================================================
# dev overlay 补丁：调小资源限制
# =============================================================================
# patchesStrategicMerge 通过"部分 YAML + 完整 kind/metadata"来匹配要改的资源。
# 这里针对每个 Deployment 只覆盖 resources，其余字段不动。
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  template:
    spec:
      containers:
        - name: user-service
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
