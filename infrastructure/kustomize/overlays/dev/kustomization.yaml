# =============================================================================
# kustomize/overlays/dev —— 开发环境覆盖
# =============================================================================
# 演示：资源限制调小、副本数 1（节省内存）。这是 Kustomize 的核心能力：
#   用 patchesStrategicMerge 在基础配置上打补丁，不改动原始文件。
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 资源清单来源：Helm 渲染产物或基础 YAML
resources:
  - ../../base

# 打补丁：所有服务的资源限制统一调小（dev 环境省内存）
patchesStrategicMerge:
  - patch-deployments.yaml
