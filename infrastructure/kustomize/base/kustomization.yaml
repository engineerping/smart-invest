# =============================================================================
# kustomize/base —— 基础配置
# =============================================================================
# Kustomize 的作用：在 Helm 之上做"环境差异化"。Helm 管模板与发布，
# Kustomize 管多环境（dev/uat/prd）的差异。
#
# 这里 base 不做实际渲染，只作为说明。实际用法两种：
#   1. base 放各环境的公共 YAML（本例：指向 helm 渲染产物）
#   2. overlays 用 patchesStrategicMerge 覆盖差异
# 因为我们的服务主要用 Helm 管理，Kustomize 这里展示"环境覆盖"能力。
# =============================================================================
# 说明：真正部署走 helm，Kustomize 作为可选的环境覆盖层。
# 如需用 kustomize 直接部署，可在此引用 helm template 的输出：
#   helm template smart-invest ../helm-charts/umbrella > base/rendered.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
