# =============================================================================
# user-service 配置
# =============================================================================
# 所有敏感值（数据库密码、JWT 密钥）都用 ${ENV_VAR} 占位，
# 在 Kubernetes 里由 Secret 注入环境变量，绝不硬编码在代码里。
# =============================================================================
server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartinvest}
    username: ${SPRING_DATASOURCE_USERNAME:smartadmin}
    password: ${SPRING_DATASOURCE_PASSWORD:localdev_only}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate   # 不自动改表结构，信任 Flyway 迁移
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true          # 只有 user-service 开启迁移
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:smartmq}
    password: ${RABBITMQ_PASSWORD:localdev_only}

# JWT：所有服务共享同一个 secret，才能互相校验 token
jwt:
  secret: ${JWT_SECRET:smartinvest-demo-secret-key-change-me-please-32bytes}
  access-token-expiry-ms: 3600000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.smartinvest: INFO
    org.springframework.security: WARN
